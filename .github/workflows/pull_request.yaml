name: Pull Request
on:
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: installing node
        uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: installing dependencies
        run: npm ci
      - name: running build
        run: npm run build
